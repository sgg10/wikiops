providers:
  local:
    type: local_files
    # Directory that holds every document. A relative value resolves against the
    # working directory of the process (not this file); "~" is expanded.
    # The directory must already exist.
    root: ./docs
    # Root-relative directory where assets are stored.
    assets_dir: assets
    # Allow create operations to replace an existing file whose content differs.
    overwrite_existing: false

profiles:
  default:
    provider: local
    refs:
      docs_root:
        provider: local
        kind: path
        locator:
          # Relative to `root`, "/" separators, no leading "/", must end in ".md".
          path: README.md
    # Add plugin-specific config only when the workflow actually needs it.
    # Prefer plugin defaults unless you intentionally want to override them.
